<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .pokedex-container {
            max-width: 600px;
            margin: 40px auto;
        }
        .pokedex-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        .pokedex-header {
            background: #e3350d;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        .pokedex-header h1 {
            margin: 0;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .pokemon-image {
            width: 200px;
            height: 200px;
            object-fit: contain;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.2));
        }
        .pokemon-sprite-container {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }
        .type-badge {
            padding: 8px 16px;
            border-radius: 20px;
            color: #fff;
            font-weight: 600;
            margin: 3px;
            display: inline-block;
            text-transform: capitalize;
        }
        .stat-bar {
            height: 10px;
            border-radius: 5px;
            background: #e9ecef;
            overflow: hidden;
        }
        .stat-bar-fill {
            height: 100%;
            border-radius: 5px;
            transition: width 0.5s ease;
        }
        .stat-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .stat-label {
            width: 100px;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: capitalize;
        }
        .stat-value {
            width: 40px;
            text-align: right;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .info-box {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }
        .info-box .label {
            font-size: 0.8rem;
            color: #6c757d;
            text-transform: uppercase;
        }
        .info-box .value {
            font-weight: 700;
            font-size: 1.1rem;
        }
        /* Cores dos tipos */
        .type-normal { background: #A8A77A; }
        .type-fire { background: #EE8130; }
        .type-water { background: #6390F0; }
        .type-electric { background: #F7D02C; color: #333; }
        .type-grass { background: #7AC74C; }
        .type-ice { background: #96D9D6; color: #333; }
        .type-fighting { background: #C22E28; }
        .type-poison { background: #A33EA1; }
        .type-ground { background: #E2BF65; color: #333; }
        .type-flying { background: #A98FF3; }
        .type-psychic { background: #F95587; }
        .type-bug { background: #A6B91A; }
        .type-rock { background: #B6A136; }
        .type-ghost { background: #735797; }
        .type-dragon { background: #6F35FC; }
        .type-dark { background: #705746; }
        .type-steel { background: #B7B7CE; color: #333; }
        .type-fairy { background: #D685AD; }
    </style>
</head>
<body>
    <div class="container pokedex-container">
        <div class="pokedex-card">
            <div class="pokedex-header">
                <h1>🔴 Pokédex</h1>
            </div>
            <div class="p-4">
                <!-- Campo de busca -->
                <form id="search-form" class="mb-4">
                    <div class="input-group input-group-lg">
                        <input 
                            type="text" 
                            id="pokemon-input" 
                            class="form-control" 
                            placeholder="Digite o nome do Pokémon..."
                            autocomplete="off"
                        >
                        <button class="btn btn-danger" type="submit" id="search-btn">
                            Buscar
                        </button>
                    </div>
                </form>

                <!-- Mensagem de erro/loading -->
                <div id="message" class="text-center mb-3"></div>

                <!-- Conteúdo do Pokémon -->
                <div id="pokemon-content" class="d-none">
                    <!-- Imagem e nome -->
                    <div class="pokemon-sprite-container">
                        <img id="pokemon-image" class="pokemon-image" src="" alt="Pokémon">
                        <h2 id="pokemon-name" class="text-center mt-3 text-capitalize"></h2>
                        <span id="pokemon-id" class="text-muted"></span>
                    </div>

                    <!-- Tipos -->
                    <div class="text-center mb-3" id="pokemon-types"></div>

                    <!-- Informações gerais -->
                    <div class="row mb-3">
                        <div class="col-4">
                            <div class="info-box">
                                <div class="label">Altura</div>
                                <div class="value" id="pokemon-height">-</div>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="info-box">
                                <div class="label">Peso</div>
                                <div class="value" id="pokemon-weight">-</div>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="info-box">
                                <div class="label">Exp. Base</div>
                                <div class="value" id="pokemon-exp">-</div>
                            </div>
                        </div>
                    </div>

                    <!-- Habilidades -->
                    <h5 class="mt-4 mb-2">Habilidades</h5>
                    <div id="pokemon-abilities" class="mb-3"></div>

                    <!-- Status -->
                    <h5 class="mt-4 mb-3">Status</h5>
                    <div id="pokemon-stats"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
